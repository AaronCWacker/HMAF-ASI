<style>
/* Layout: one-screen presenter. Top rail (act · slide · 60s timer) → stage (slide) → bottom rail (nav).
   Overview = 7×7 honeycomb of loci rooms. Honey = hive accent; teal = clinical secondary. */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --ink:#132030; --muted:#56657A; --line:#D5DCE6;
  --honey:#A86C00; --honey-soft:#F7E8C6; --teal:#0C7471; --teal-soft:#D5EFEE; --warn:#B4361F;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C131B; --surface:#141F2A; --ink:#E7EDF4; --muted:#91A0B2; --line:#243241;
  --honey:#F2B33D; --honey-soft:#3A2B0E; --teal:#45C4BC; --teal-soft:#0F2E2E; --warn:#FF7A5C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C131B; --surface:#141F2A; --ink:#E7EDF4; --muted:#91A0B2; --line:#243241;
  --honey:#F2B33D; --honey-soft:#3A2B0E; --teal:#45C4BC; --teal-soft:#0F2E2E; --warn:#FF7A5C; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  display:flex;flex-direction:column;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--teal)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--honey);outline-offset:2px}

/* rails */
.rail{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.rail.top{border-bottom:1px solid var(--line)}
.rail.bottom{border-top:1px solid var(--line);justify-content:space-between}
.brand{font-family:var(--f-display);font-weight:800;letter-spacing:.01em;font-size:15px;display:flex;align-items:center;gap:8px;min-width:0}
.brand .hexdot{width:14px;height:16px;background:var(--honey);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);flex:none}
.actlabel{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.count{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.timer{display:flex;align-items:center;gap:6px;background:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 4px;cursor:pointer}
.timer svg{width:26px;height:26px;transform:rotate(-90deg)}
.timer .trk{fill:none;stroke:var(--line);stroke-width:4}
.timer .arc{fill:none;stroke:var(--honey);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .9s linear}
.timer.over .arc{stroke:var(--warn)}
.timer .t{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px;min-width:3.2ch}
.timer.over .t{color:var(--warn)}
.progress{height:3px;background:var(--line);position:relative}
.progress i{position:absolute;inset:0 auto 0 0;background:var(--honey);transition:width .25s}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:14px}
.btn:hover{border-color:var(--honey)}
.btn.primary{background:var(--honey);border-color:var(--honey);color:var(--bg);font-weight:700}
.btn[aria-pressed="true"]{background:var(--honey-soft);border-color:var(--honey)}
.navgroup{display:flex;gap:8px;flex-wrap:wrap}
.hint{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
@media (max-width:640px){.hint{display:none}.actlabel{display:none}}

/* stage */
main{flex:1;min-height:0;overflow:auto;padding-block:20px}
.frame{max-width:1180px;margin:0 auto;animation:in .28s ease-out both}
@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.frame{animation:none}.progress i,.timer .arc{transition:none}}

.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.eyebrow b{color:var(--honey);font-weight:600}
h1,h2{font-family:var(--f-display);text-wrap:balance;margin:0}
.slide h2{font-size:clamp(26px,3.6vw,44px);line-height:1.08;font-weight:700;margin-top:8px}
.slide h2 .em{margin-right:.25em}
.tag{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-family:var(--f-mono);font-size:13px;background:var(--honey-soft);color:var(--ink);border-radius:999px;padding:4px 12px}
.tag span{color:var(--honey);font-weight:600}

.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:24px;margin-top:22px}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}

/* three-point table */
.pts{width:100%;border-collapse:collapse;font-size:clamp(15px,1.45vw,18px)}
.pts th{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:0 10px 8px;border-bottom:2px solid var(--ink)}
.pts td{padding:14px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.pts td.n{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--honey);width:2.2ch;padding-left:0}
.pts td.d{font-family:var(--f-mono);font-size:13px;color:var(--teal);white-space:nowrap}
@media (max-width:520px){.pts td.d{white-space:normal}}

/* media slot */
.media{border:1.5px dashed var(--line);border-radius:12px;aspect-ratio:16/9;max-width:100%;display:grid;place-items:center;text-align:center;position:relative;overflow:hidden;background:
  repeating-linear-gradient(60deg,transparent 0 22px,color-mix(in srgb,var(--line) 35%,transparent) 22px 23px)}
.media.drag{border-color:var(--honey);background:var(--honey-soft)}
.media img,.media video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--bg)}
.media .ph{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px}
.media .fn{font-family:var(--f-mono);font-size:13px}
.media .sub{font-size:13px;color:var(--muted)}
.media .clear{position:absolute;top:8px;right:8px;z-index:2;font-size:12px;padding:4px 8px}
.media input{position:absolute;width:1px;height:1px;opacity:0}

/* reference + prompt */
.ref{border-left:3px solid var(--teal);padding:2px 0 2px 14px;display:flex;flex-direction:column;gap:4px}
.ref .lbl,.prompt .lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ref .pt{font-weight:700;line-height:1.35}
.ref .links{display:flex;gap:14px;flex-wrap:wrap;font-size:14px}
.prompt{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.prompt code{font-family:var(--f-mono);font-size:13.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word;user-select:all}
.prompt .row{display:flex;justify-content:space-between;align-items:center;gap:8px}

/* title & divider frames */
.hero{display:flex;flex-direction:column;gap:18px;padding-block:4vh}
.hero h1{font-size:clamp(34px,6vw,76px);line-height:1.02;font-weight:800;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--honey)}
.hero .lede{font-size:clamp(17px,1.8vw,21px);max-width:62ch;color:var(--muted)}
.byline{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.formula{display:flex;gap:10px;flex-wrap:wrap}
.formula span{font-family:var(--f-mono);font-size:14px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--surface)}
.formula span b{color:var(--honey)}

.divider{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:start;padding-block:3vh}
@media (max-width:700px){.divider{grid-template-columns:1fr}}
.roman{font-family:var(--f-display);font-weight:800;font-size:clamp(80px,14vw,170px);line-height:.85;color:var(--honey)}
.divider h2{font-size:clamp(30px,4.4vw,54px);line-height:1.05}
.divider .why{color:var(--muted);font-size:18px;max-width:58ch;margin-top:10px}
.rooms{list-style:none;padding:0;margin:22px 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.rooms li{display:flex;gap:10px;align-items:baseline;padding:8px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line);cursor:pointer}
.rooms li:hover{border-color:var(--honey)}
.rooms .k{font-family:var(--f-mono);font-size:12px;color:var(--honey);min-width:2.4ch;font-variant-numeric:tabular-nums}

/* overview honeycomb */
#overview{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--bg) 96%,transparent);overflow:auto;
  padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ovhead{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:1100px;margin:0 auto 14px;flex-wrap:wrap}
.ovhead h2{font-size:24px}
.comb{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:6px;overflow-x:auto;padding-bottom:8px}
.combrow{display:flex;gap:6px;align-items:center}
.combrow:nth-child(even){padding-left:52px}
.rowlbl{width:96px;flex:none;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);line-height:1.2}
.hex{width:104px;height:116px;flex:none;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--surface);border:0;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:14px 10px;text-align:center;position:relative}
.hex::before{content:"";position:absolute;inset:0;clip-path:inherit;box-shadow:inset 0 0 0 2px var(--line);pointer-events:none}
.hex .e{font-size:22px;line-height:1}
.hex .no{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.hex .tt{font-size:10.5px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hex.seen{background:var(--teal-soft)}
.hex.cur{background:var(--honey-soft)}
.hex:hover{background:var(--honey-soft)}
.legend{max-width:1100px;margin:12px auto 0;display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px;border:1px solid var(--line)}

.toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;z-index:30}
.close-links{display:flex;gap:10px;flex-wrap:wrap}
.steps{list-style:none;padding:0;margin:0;display:grid;gap:8px;max-width:760px;counter-reset:s}
.steps li{display:grid;grid-template-columns:2.2ch minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.steps li::before{counter-increment:s;content:counter(s);font-family:var(--f-display);font-weight:800;color:var(--honey);font-size:20px;line-height:1.2}
</style>

// frames: title, then per act a divider + 7 slides, then closing
const F=[{k:"title"}];
ACTS.forEach((a,ai)=>{F.push({k:"act",ai});S.forEach((s,si)=>{if(s[0]===ai)F.push({k:"slide",si})})});
F.push({k:"close"});

const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let cur=0, seen=new Set(), auto=false, remain=60, paused=false, tick=null;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ---- media store (IndexedDB, best effort) ---- */
let dbp=null;
function db(){ if(dbp) return dbp; dbp=new Promise(res=>{try{const r=indexedDB.open("hive-deck-media",1);r.onupgradeneeded=()=>r.result.createObjectStore("m");r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}}); return dbp;}
async function mget(k){const d=await db();if(!d)return null;return new Promise(r=>{try{const q=d.transaction("m").objectStore("m").get(k);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)}catch(e){r(null)}})}
async function mput(k,v){const d=await db();if(!d)return;try{d.transaction("m","readwrite").objectStore("m").put(v,k)}catch(e){}}
async function mdel(k){const d=await db();if(!d)return;try{d.transaction("m","readwrite").objectStore("m").delete(k)}catch(e){}}
const memMedia={};

function slideNo(si){return si+1}
function render(){
  const f=F[cur]; const st=$("stage");
  let html="";
  if(f.k==="title"){
    $("actlabel").textContent="Opening";
    html=`<div class="frame hero">
      <div class="eyebrow"><b>FDE Mentor Session</b><span>49 slides · 1 minute each</span></div>
      <h1>Distributed <em>Hive Mind</em> Agentic Workflows for Progressive Longitudinal Intelligence</h1>
      <p class="lede">Solving for AI operations at scale in healthcare: care and compassion first, then the specs, memory, swarms, and delivery patterns that make it work.</p>
      <div class="formula"><span><b>7</b> acts</span><span>× <b>7</b> rooms</span><span>= <b>49</b> minutes</span><span>🧭 walk it like a memory palace</span></div>
      <p class="byline">Aaron C. Wacker · All.AI Inc. · AI pair programming with Claude</p>
      <div class="navgroup"><button class="btn primary" data-go="1">Begin Act I →</button><button class="btn" data-map>⬢ Open the 7×7 map</button></div>
    </div>`;
  } else if(f.k==="act"){
    const a=ACTS[f.ai];
    $("actlabel").textContent=`Act ${a.r} · ${a.name}`;
    const items=S.map((s,si)=>[s,si]).filter(([s])=>s[0]===f.ai);
    html=`<div class="frame divider">
      <div class="roman" aria-hidden="true">${a.r}</div>
      <div style="min-width:0">
        <div class="eyebrow"><b>Act ${a.r} of VII</b><span>Slides ${slideNo(items[0][1])}–${slideNo(items[6][1])}</span></div>
        <h2>${a.e} ${esc(a.name)}</h2>
        <p class="why">${esc(a.why)}</p>
        <ol class="rooms">${items.map(([s,si])=>`<li data-slide="${si}" tabindex="0"><span class="k">${String(slideNo(si)).padStart(2,"0")}</span><span>${s[2]} ${esc(s[3])}</span></li>`).join("")}</ol>
      </div></div>`;
  } else if(f.k==="slide"){
    const s=S[f.si], a=ACTS[s[0]], v=s[9]?V[s[9]]:null;
    $("actlabel").textContent=`Act ${a.r} · ${a.name}`;
    const isPdf=/arxiv\.org\/pdf/.test(s[8]);
    html=`<article class="frame slide">
      <div class="eyebrow"><b>Slide ${slideNo(f.si)} / 49</b><span>Act ${a.r}</span><span>Topic #${s[1]} in your list</span></div>
      <h2><span class="em">${s[2]}</span>${esc(s[3])}</h2>
      <div class="tag">🔑 <span>${esc(s[4])}</span></div>
      <div class="grid">
        <div class="col">
          <div style="overflow-x:auto"><table class="pts"><thead><tr><th></th><th>🎯 Point</th><th>🗝️ Distilled</th></tr></thead><tbody>
            ${s[6].map((p,i)=>`<tr><td class="n">${i+1}</td><td>${esc(p[0])}</td><td class="d">${esc(p[1])}</td></tr>`).join("")}
          </tbody></table></div>
          <div class="prompt"><div class="row"><span class="lbl">📋 Try this prompt</span><button class="btn" data-copy="${f.si}">Copy</button></div><code id="pr${f.si}">${esc(s[10])}</code></div>
        </div>
        <div class="col">
          <div class="media" id="media" data-key="${s[5]}">
            <div class="ph"><span style="font-size:28px">${/mp4$/.test(s[5])?"🎬":"🖼️"}</span><span class="fn">${s[5]}</span><span class="sub">Drop a PNG or MP4 here, or <button class="btn" data-pick style="padding:2px 8px;font-size:13px">choose a file</button></span></div>
            <input type="file" id="mfile" accept="image/*,video/*" aria-label="Choose media for this slide">
          </div>
          <div class="ref"><span class="lbl">📚 Best-match reference</span><span class="pt">${esc(s[7])}</span>
            <span class="links"><a href="${s[8]}" target="_blank" rel="noopener">${isPdf?"📄 arXiv PDF "+s[8].split("/").pop():"📕 Read the paper"}</a>${v?`<a href="${v[1]}" target="_blank" rel="noopener">📺 ${esc(v[0])}</a>`:""}</span></div>
        </div>
      </div></article>`;
  } else {
    $("actlabel").textContent="Close";
    html=`<div class="frame hero">
      <div class="eyebrow"><b>Lift and shift</b><span>From memory map to super app</span></div>
      <h1>Keep the map <em>alive</em></h1>
      <ol class="steps">
        <li>Revise the Markdown memory map; it stays the single source of truth.</li>
        <li>Fill each slide's media slot from your MP4 and PNG folders (the file names are already set).</li>
        <li>Generate the PowerPoint: one slide per card, with title, three-row table, and media.</li>
        <li>Grow this deck into the super HTML app: 7 rooms × 7 stations, each demoing its technique with file-type I/O.</li>
        <li>After each talk, log questions as episodes and update the map progressively.</li>
      </ol>
      <div class="close-links"><a class="btn" href="https://allaiinc.org/" target="_blank" rel="noopener">🌐 allaiinc.org</a><a class="btn" href="https://github.com/AaronCWacker/AI-UI-UX-JS/" target="_blank" rel="noopener">💻 AI-UI-UX-JS on GitHub</a><button class="btn" data-go="0">↺ Back to start</button></div>
      <p class="byline">🖤 Inventor: Aaron C. Wacker · Co-author via AI pair programming: Claude</p>
    </div>`;
  }
  st.innerHTML=html;
  if(f.k==="slide"){ seen.add(f.si); wireMedia(S[f.si][5]); }
  $("count").textContent=f.k==="slide"?`${slideNo(f.si)} / 49`:(f.k==="act"?`Act ${ACTS[f.ai].r}`:(cur===0?"Start":"End"));
  $("bar").style.width=(cur/(F.length-1)*100)+"%";
  $("prev").disabled=cur===0; $("next").disabled=cur===F.length-1;
  store.set("hive-deck-pos",String(cur));
  try{history.replaceState(null,"","#f"+cur)}catch(e){}
  $("main").scrollTop=0;
  resetTimer();
}

function go(i){cur=Math.max(0,Math.min(F.length-1,i));render();}
function goSlide(si){go(F.findIndex(f=>f.k==="slide"&&f.si===si));closeMap();}

/* media slot */
function showMedia(el,blob){
  el.querySelectorAll("img,video,.clear").forEach(n=>n.remove());
  if(!blob) return;
  const url=URL.createObjectURL(blob);
  const m=blob.type.startsWith("video")?Object.assign(document.createElement("video"),{src:url,controls:true,muted:true,loop:true,playsInline:true}):Object.assign(document.createElement("img"),{src:url,alt:"Slide media"});
  el.appendChild(m);
  const c=document.createElement("button");c.className="btn clear";c.textContent="Remove";c.onclick=async e=>{e.stopPropagation();delete memMedia[el.dataset.key];await mdel(el.dataset.key);showMedia(el,null)};
  el.appendChild(c);
}
async function wireMedia(key){
  const el=$("media"), inp=$("mfile");
  const existing=memMedia[key]||await mget(key);
  if($("media")===el && existing) showMedia(el,existing);
  const take=async file=>{ if(!file||!/^(image|video)\//.test(file.type)){toast("Use a PNG, JPG, or MP4 file.");return} memMedia[key]=file; await mput(key,file); showMedia(el,file); toast("Media added to this slide"); };
  inp.onchange=()=>take(inp.files[0]);
  el.ondragover=e=>{e.preventDefault();el.classList.add("drag")};
  el.ondragleave=()=>el.classList.remove("drag");
  el.ondrop=e=>{e.preventDefault();el.classList.remove("drag");take(e.dataTransfer.files[0])};
}

/* timer */
const CIRC=75.4;
function drawTimer(){const t=Math.max(remain,0);$("tval").textContent=remain<0?"+"+Math.abs(remain)+"s":`${Math.floor(t/60)}:${String(t%60).padStart(2,"0")}`;
  $("arc").style.strokeDashoffset=String(CIRC*(1-Math.max(remain,0)/60));$("timer").classList.toggle("over",remain<=0);
  $("timer").setAttribute("aria-label",paused?"Timer paused":"Time left on this slide");}
function resetTimer(){remain=60;drawTimer();}
function startTick(){clearInterval(tick);tick=setInterval(()=>{if(paused||!$("overview").hidden)return;remain--;drawTimer();if(remain===0&&auto&&F[cur].k!=="close")go(cur+1)},1000)}
function toggleTimer(){paused=!paused;toast(paused?"Timer paused":"Timer running");drawTimer()}

/* overview */
function buildMap(){
  const comb=$("comb");
  comb.innerHTML=ACTS.map((a,ai)=>`<div class="combrow"><div class="rowlbl">Act ${a.r}<br>${a.e}</div>${S.map((s,si)=>[s,si]).filter(([s])=>s[0]===ai).map(([s,si])=>{
    const isCur=F[cur].k==="slide"&&F[cur].si===si;
    return `<button class="hex${isCur?" cur":seen.has(si)?" seen":""}" data-slide="${si}" title="${esc(s[3])}"><span class="e">${s[2]}</span><span class="no">${String(si+1).padStart(2,"0")}</span><span class="tt">${esc(s[4])}</span></button>`}).join("")}</div>`).join("");
}
function openMap(){buildMap();$("overview").hidden=false;$("ovclose").focus()}
function closeMap(){$("overview").hidden=true}

let tt=null;function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,1600)}

/* events */
$("prev").onclick=()=>go(cur-1);
$("next").onclick=()=>go(cur+1);
$("timer").onclick=toggleTimer;
$("auto").onclick=()=>{auto=!auto;$("auto").setAttribute("aria-pressed",String(auto));toast(auto?"Auto-advance on: next slide when the minute ends":"Auto-advance off")};
$("ovbtn").onclick=openMap; $("ovclose").onclick=closeMap;
$("fs").onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>toast("Fullscreen isn't available here"))}catch(e){toast("Fullscreen isn't available here")}};
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");if(g){go(+g.dataset.go);return}
  if(e.target.closest("[data-map]")){openMap();return}
  const sl=e.target.closest("[data-slide]");if(sl){goSlide(+sl.dataset.slide);return}
  if(e.target.closest("[data-pick]")){$("mfile")?.click();return}
  const cp=e.target.closest("[data-copy]");if(cp){const txt=S[+cp.dataset.copy][10];
    const sel=()=>{const r=document.createRange();r.selectNodeContents($("pr"+cp.dataset.copy));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Selected. Press Ctrl+C or ⌘C to copy")};
    try{navigator.clipboard.writeText(txt).then(()=>toast("✅ Prompt copied"),sel)}catch(err){sel()}}
});
document.addEventListener("keydown",e=>{
  if(e.target.matches("input,textarea"))return;
  const k=e.key;
  if(!$("overview").hidden){if(k==="Escape"||k==="o"||k==="O")closeMap();return}
  if(k==="Enter"&&e.target.matches("li[data-slide]")){goSlide(+e.target.dataset.slide);return}
  if(k==="ArrowRight"||k==="PageDown"||(k===" "&&!e.target.matches("button"))){e.preventDefault();go(cur+1)}
  else if(k==="ArrowLeft"||k==="PageUp"){e.preventDefault();go(cur-1)}
  else if(k==="Home")go(0); else if(k==="End")go(F.length-1);
  else if(k==="o"||k==="O")openMap(); else if(k==="t"||k==="T")toggleTimer();
  else if(k==="a"||k==="A")$("auto").click(); else if(k==="f"||k==="F")$("fs").click();
});
let sx=null;$("main").addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
$("main").addEventListener("touchend",e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>70)go(cur+(dx<0?1:-1));sx=null},{passive:true});

/* boot: #f12 deep link, else last position */
const h=/^#f(\d+)$/.exec(location.hash||"");const saved=parseInt(store.get("hive-deck-pos")||"0",10);
cur=h?Math.min(+h[1],F.length-1):(isNaN(saved)?0:Math.min(saved,F.length-1));
render();startTick();
</script>

</body></html>
